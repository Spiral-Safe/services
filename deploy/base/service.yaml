apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiral-service
  labels:
    app.kubernetes.io/name: spiral-service
    app.kubernetes.io/part-of: spiral-safe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spiral-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spiral-service
        app.kubernetes.io/part-of: spiral-safe
    spec:
      serviceAccountName: spiral-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: spiral-safe/service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: SERVICE_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: SERVICE_DEV_MODE
            - name: VAULT_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_ADDRESS
            - name: VAULT_K8S_ROLE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_K8S_ROLE
                  optional: true
            - name: VAULT_K8S_AUTH_PATH
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_K8S_AUTH_PATH
                  optional: true
            - name: VAULT_K8S_JWT_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: CORS_ALLOWED_ORIGINS
            - name: WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ID
            - name: WEBAUTHN_RP_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ORIGINS
            - name: API_TOKEN_HASHES
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TOKEN_HASHES
                  optional: true
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TOKEN
                  optional: true
            - name: API_TENANT
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TENANT
                  optional: true
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: VAULT_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spiral-service
  labels:
    app.kubernetes.io/name: spiral-service
    app.kubernetes.io/part-of: spiral-safe
spec:
  selector:
    app.kubernetes.io/name: spiral-service
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
