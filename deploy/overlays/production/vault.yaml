apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: cluster
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vault-active
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
spec:
  selector:
    app.kubernetes.io/name: vault
    vault-active: "true"
  ports:
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
spec:
  serviceName: vault-internal
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: spiral-safe
    spec:
      serviceAccountName: vault
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      containers:
        - name: vault
          image: spiral-safe/vault-plugin
          imagePullPolicy: IfNotPresent
          command:
            - vault
          args:
            - server
            - -config=/vault/config/vault.hcl
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_API_ADDR
              value: https://$(POD_NAME).vault-internal:8200
            - name: VAULT_CLUSTER_ADDR
              value: https://$(POD_NAME).vault-internal:8201
            - name: VAULT_CACERT
              value: /vault/tls/ca.crt
            - name: WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ID
            - name: WEBAUTHN_RP_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ORIGINS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: vault-unseal
                  key: AWS_REGION
            - name: VAULT_AWSKMS_SEAL_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: vault-unseal
                  key: VAULT_AWSKMS_SEAL_KEY_ID
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - vault status >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: tls
              mountPath: /vault/tls
              readOnly: true
            - name: data
              mountPath: /vault/data
            - name: audit
              mountPath: /vault/audit
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: tls
          secret:
            secretName: vault-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: vault
          app.kubernetes.io/part-of: spiral-safe
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: audit
        labels:
          app.kubernetes.io/name: vault
          app.kubernetes.io/part-of: spiral-safe
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
