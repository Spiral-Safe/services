apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiral-client
  labels:
    app.kubernetes.io/name: spiral-client
    app.kubernetes.io/part-of: spiral-safe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spiral-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spiral-client
        app.kubernetes.io/part-of: spiral-safe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: spiral-safe/client
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spiral-client
  labels:
    app.kubernetes.io/name: spiral-client
    app.kubernetes.io/part-of: spiral-safe
spec:
  selector:
    app.kubernetes.io/name: spiral-client
  ports:
    - name: http
      port: 9080
      targetPort: http
      protocol: TCP
