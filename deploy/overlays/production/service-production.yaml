apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiral-service
spec:
  template:
    spec:
      initContainers:
        - name: billing-migrate
          image: spiral-safe/service
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/billing/migrate.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DATABASE_URL
            - name: DATABASE_SSL
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: service
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/spiral-safe/vault/ca.crt
          volumeMounts:
            - name: vault-ca
              mountPath: /var/run/secrets/spiral-safe/vault
              readOnly: true
      volumes:
        - name: vault-ca
          secret:
            secretName: vault-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
