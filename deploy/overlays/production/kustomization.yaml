apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spiral-safe
resources:
  - ../../base
  - vault-config.yaml
  - vault-rbac.yaml
  - vault.yaml
  - network-policy.yaml
configMapGenerator:
  - name: spiral-service-config
    literals:
      - SERVICE_DEV_MODE=false
      - VAULT_ADDRESS=https://vault-active:8200
      - VAULT_K8S_ROLE=spiral-service
      - VAULT_K8S_AUTH_PATH=auth/kubernetes
      - CORS_ALLOWED_ORIGINS=https://REPLACE_ME.invalid
      - WEBAUTHN_RP_ID=REPLACE_ME.invalid
      - WEBAUTHN_RP_ORIGINS=https://REPLACE_ME.invalid
patches:
  - path: service-production.yaml
  - path: namespace-security.yaml
  - path: remove-client.yaml
