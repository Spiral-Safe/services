apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-service-registration
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-service-registration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-service-registration
subjects:
  - kind: ServiceAccount
    name: vault
---
# Vault's Kubernetes auth method uses TokenReview. Review this cluster-scoped
# binding with the platform team before applying the production overlay.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spiral-safe-vault-tokenreview
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: spiral-safe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: spiral-safe
