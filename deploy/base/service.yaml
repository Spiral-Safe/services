apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiral-service
  labels:
    app.kubernetes.io/name: spiral-service
    app.kubernetes.io/part-of: spiral-safe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spiral-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spiral-service
        app.kubernetes.io/part-of: spiral-safe
    spec:
      serviceAccountName: spiral-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: spiral-safe/service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: SERVICE_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: SERVICE_DEV_MODE
            - name: VAULT_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_ADDRESS
            - name: VAULT_K8S_ROLE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_K8S_ROLE
                  optional: true
            - name: VAULT_K8S_AUTH_PATH
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: VAULT_K8S_AUTH_PATH
                  optional: true
            - name: VAULT_K8S_JWT_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: CORS_ALLOWED_ORIGINS
            - name: WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ID
            - name: WEBAUTHN_RP_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: WEBAUTHN_RP_ORIGINS
            - name: BILLING_MODE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: BILLING_MODE
                  optional: true
            - name: BILLING_DEMO_SEED
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: BILLING_DEMO_SEED
                  optional: true
            - name: DATABASE_SSL
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: DATABASE_SSL
                  optional: true
            - name: CONSOLE_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: CONSOLE_ORIGIN
                  optional: true
            - name: BILLING_PLANS_JSON
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: BILLING_PLANS_JSON
                  optional: true
            - name: STRIPE_CHECKOUT_SUCCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: STRIPE_CHECKOUT_SUCCESS_URL
                  optional: true
            - name: STRIPE_CHECKOUT_CANCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: STRIPE_CHECKOUT_CANCEL_URL
                  optional: true
            - name: STRIPE_PORTAL_RETURN_URL
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: STRIPE_PORTAL_RETURN_URL
                  optional: true
            - name: STRIPE_CHECKOUT_INTENT_VERSION
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: STRIPE_CHECKOUT_INTENT_VERSION
                  optional: true
            - name: METRONOME_INGEST_URL
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: METRONOME_INGEST_URL
                  optional: true
            - name: METRONOME_EXPORT_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: METRONOME_EXPORT_INTERVAL_MS
                  optional: true
            - name: METRONOME_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: METRONOME_BATCH_SIZE
                  optional: true
            - name: METRONOME_STRIPE_INVOICING_VERIFIED
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: METRONOME_STRIPE_INVOICING_VERIFIED
                  optional: true
            - name: BILLING_RESERVATION_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: BILLING_RESERVATION_TTL_MS
                  optional: true
            - name: CONSOLE_SESSION_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: spiral-service-config
                  key: CONSOLE_SESSION_TTL_MS
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DATABASE_URL
                  optional: true
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: API_KEY_PEPPER
                  optional: true
            - name: CONSOLE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: CONSOLE_SESSION_SECRET
                  optional: true
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: STRIPE_API_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: METRONOME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: METRONOME_API_TOKEN
                  optional: true
            - name: DEMO_DEVELOPER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DEMO_DEVELOPER_EMAIL
                  optional: true
            - name: DEMO_DEVELOPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DEMO_DEVELOPER_PASSWORD
                  optional: true
            - name: DEMO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DEMO_ADMIN_EMAIL
                  optional: true
            - name: DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spiral-service-billing
                  key: DEMO_ADMIN_PASSWORD
                  optional: true
            - name: API_TOKEN_HASHES
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TOKEN_HASHES
                  optional: true
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TOKEN
                  optional: true
            - name: API_TENANT
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: API_TENANT
                  optional: true
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spiral-service-auth
                  key: VAULT_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spiral-service
  labels:
    app.kubernetes.io/name: spiral-service
    app.kubernetes.io/part-of: spiral-safe
spec:
  selector:
    app.kubernetes.io/name: spiral-service
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
