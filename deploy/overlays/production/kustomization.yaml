apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spiral-safe
resources:
  - ../../base
  - vault-config.yaml
  - vault-rbac.yaml
  - vault.yaml
  - network-policy.yaml
configMapGenerator:
  - name: spiral-service-config
    literals:
      - SERVICE_DEV_MODE=false
      - VAULT_ADDRESS=https://vault-active:8200
      - VAULT_K8S_ROLE=spiral-service
      - VAULT_K8S_AUTH_PATH=auth/kubernetes
      - CORS_ALLOWED_ORIGINS=https://REPLACE_ME.invalid
      - WEBAUTHN_RP_ID=REPLACE_ME.invalid
      - WEBAUTHN_RP_ORIGINS=https://REPLACE_ME.invalid
      - BILLING_MODE=postgres
      - BILLING_DEMO_SEED=false
      - DATABASE_SSL=true
      - CONSOLE_ORIGIN=https://REPLACE_ME.invalid
      - STRIPE_CHECKOUT_INTENT_VERSION=v1
      - METRONOME_STRIPE_INVOICING_VERIFIED=false
      - BILLING_RESERVATION_TTL_MS=300000
      - CONSOLE_SESSION_TTL_MS=28800000
patches:
  - path: service-production.yaml
  - path: namespace-security.yaml
  - path: remove-client.yaml
