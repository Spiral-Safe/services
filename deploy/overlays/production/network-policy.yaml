apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spiral-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              spiral-safe.io/ingress-access: allowed
          podSelector:
            matchLabels:
              spiral-safe.io/ingress: "true"
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spiral-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Billing stays fail-closed by default. These podSelectors permit only
    # same-namespace destination pods carrying the reviewed, purpose-specific
    # label. They do not select a Service, another namespace, a DNS name, or an
    # external provider. Managed database and Stripe/Metronome routes are
    # deployment-specific and require a separate operator-owned policy (or a
    # reviewed same-namespace gateway) rather than opening 0.0.0.0/0 here.
    - to:
        - podSelector:
            matchLabels:
              spiral-safe.io/billing-database: "allowed"
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              spiral-safe.io/billing-gateway: "allowed"
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spiral-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
        - podSelector:
            matchLabels:
              spiral-safe.io/vault-operator: "true"
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8201
          protocol: TCP
