services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile.vault
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    environment:
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_ORIGINS=http://localhost:9080
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "127.0.0.1:${CLIENT_PORT:-9080}:9080"
    depends_on:
      - service
  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "127.0.0.1:${SERVICE_PORT:-3000}:3000"
    environment:
      - VAULT_ADDRESS=http://vault:8200
      - VAULT_TOKEN=root
      - SERVICE_DEV_MODE=true
      - API_TOKEN=spiral-safe-local-development-only
      - API_TENANT=local
      - CORS_ALLOWED_ORIGINS=http://localhost:9080
    depends_on:
      - vault
